name: Deploy Frontend to EC2

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: industrysolutions/hdl
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.app \
            --build-arg NEXT_PUBLIC_KEHRNEL_AQL_ENDPOINT=http://kehrnel-kehrnel-api-1:8080 \
            --build-arg NEXT_PUBLIC_BACKEND_URL=http://kehrnel-kehrnel-api-1:8080 \
            --build-arg NEXT_PUBLIC_MONGODBEHR_URL=http://kehrnel-kehrnel-api-1:8080 \
            --build-arg NEXT_PUBLIC_KEHRNEL_DOCS_URL=https://data-lab.mongodb-industry-solutions.com/guide \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2 via SSM
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 600 \
            --parameters '{"commands":[
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "cd /home/ec2-user/HealthcareDataLab/HealthcareDataLab",
              "docker compose pull",
              "docker compose up -d --remove-orphans",
              "docker image prune -f",
              "docker builder prune -af"
            ]}' \
            --output text \
            --query "Command.CommandId")
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for SSM command to complete
        run: |
          COMMAND_ID=${{ env.COMMAND_ID }}
          sleep 60
          for i in {1..20}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment succeeded"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for deployment"
          exit 1